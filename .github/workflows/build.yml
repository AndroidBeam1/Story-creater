name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Create Capacitor project
        run: |
          npm init -y
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/filesystem@7 @capacitor/share@7 @capacitor-community/keep-awake@7
          mkdir www && cp index.html www/
          cat > capacitor.config.json <<'JSON'
          {"appId":"com.panelpress.app","appName":"Panel Press","webDir":"www","plugins":{"CapacitorHttp":{"enabled":true}}}
          JSON
          npx cap add android
          sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO"/><uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/><uses-permission android:name="android.permission.WAKE_LOCK"/><application#' android/app/src/main/AndroidManifest.xml
          sed -i 's/versionCode 1/versionCode 671/; s/versionName "1.0"/versionName "6.71"/' android/app/build.gradle
          npx cap sync android
      - name: Build
        run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: PanelPress-6.71-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
